<!doctype html>
<html>
  <body>
    <!-- Detected by Netlify at deploy time. The app posts here so the admin gets an email for each request. -->
    <form name="admin-requests" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="admin-requests" />
      <input name="topic" />
      <input name="username" />
      <input name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
